<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="sciLab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#sciLab)"/>

  <!-- Science Project Table -->
  <rect x="80" y="220" width="440" height="150" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Project Model: Working Volcano / Windmill Model -->
  <g transform="translate(240, 130)">
    <!-- Tower -->
    <polygon points="50,0 70,0 80,90 40,90" fill="#64748b"/>
    <!-- Windmill blades -->
    <circle cx="60" cy="15" r="7" fill="#facc15"/>
    <line x1="60" y1="15" x2="60" y2="-25" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="60" y1="15" x2="95" y2="35" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="60" y1="15" x2="25" y2="35" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <!-- Battery / Wires -->
    <rect x="100" y="60" width="30" height="30" rx="3" fill="#ef4444"/>
    <path d="M 115,60 Q 90,40 70,50" stroke="#facc15" stroke-width="2" fill="none"/>
  </g>

  <!-- Two Students with White Aprons -->
  <g transform="translate(140, 140)">
    <!-- Student 1 -->
    <circle cx="30" cy="30" r="16" fill="#fbcfe8"/>
    <rect x="15" y="50" width="30" height="60" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <!-- Student 2 -->
    <circle cx="290" cy="30" r="16" fill="#fbcfe8"/>
    <rect x="275" y="50" width="30" height="60" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Banner -->
  <rect x="110" y="335" width="380" height="45" rx="8" fill="#0f766e" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="300" y="356" font-family="'Noto Serif Bengali', serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
    ২০০৫ সালের বিজ্ঞান মেলা ও নবীন উদ্ভাবক দল • এসএসসি ২০০৫
  </text>
  <text x="300" y="371" font-family="'DM Sans', sans-serif" font-size="9.5" font-weight="bold" fill="#99f6e4" text-anchor="middle" letter-spacing="1">
    SSC BATCH 2005 • SCIENCE FAIR RUNNER-UP PROJECT
  </text>
</svg>

