<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="farewellBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#farewellBg)"/>

  <!-- Stage Curtains & Backdrop -->
  <path d="M 0,0 L 70,0 Q 50,150 90,300 L 0,300 Z" fill="#991b1b"/>
  <path d="M 600,0 L 530,0 Q 550,150 510,300 L 600,300 Z" fill="#991b1b"/>

  <!-- Stage Podium & Backdrop Text -->
  <g transform="translate(150, 40)">
    <rect x="0" y="0" width="300" height="100" rx="8" fill="#064e3b" stroke="#facc15" stroke-width="2"/>
    <text x="150" y="38" font-family="'Noto Serif Bengali', serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
      এসএসসি ২০১৪ ব্যাচ বিদায় সংবর্ধনা
    </text>
    <text x="150" y="60" font-family="'DM Sans', sans-serif" font-size="11" font-weight="bold" fill="#facc15" text-anchor="middle" letter-spacing="1">
      FAREWELL CEREMONY • SSC BATCH 2014
    </text>
    <text x="150" y="82" font-family="'Noto Serif Bengali', serif" font-size="11" fill="#a7f3d0" text-anchor="middle">
      "স্মৃতিতে অমলিন মুছাপুর উচ্চ বিদ্যালয়"
    </text>
  </g>

  <!-- Graduating Students holding Crests & Flowers -->
  <g transform="translate(130, 160)">
    <!-- Student A -->
    <circle cx="50" cy="50" r="16" fill="#fbcfe8"/>
    <polygon points="35,42 50,37 65,42 50,47" fill="#0f172a"/>
    <rect x="35" y="70" width="30" height="60" rx="3" fill="#0d5c4a"/>
    
    <!-- Student B -->
    <circle cx="120" cy="50" r="16" fill="#fbcfe8"/>
    <polygon points="105,42 120,37 135,42 120,47" fill="#0f172a"/>
    <rect x="105" y="70" width="30" height="60" rx="3" fill="#0d5c4a"/>

    <!-- Student C (holding crest) -->
    <circle cx="190" cy="46" r="16" fill="#fbcfe8"/>
    <polygon points="175,38 190,33 205,38 190,43" fill="#0f172a"/>
    <rect x="175" y="66" width="30" height="64" rx="3" fill="#0d5c4a"/>
    <polygon points="185,90 195,90 200,105 180,105" fill="#facc15"/>

    <!-- Student D -->
    <circle cx="260" cy="50" r="16" fill="#fbcfe8"/>
    <polygon points="245,42 260,37 275,42 260,47" fill="#0f172a"/>
    <rect x="245" y="70" width="30" height="60" rx="3" fill="#0d5c4a"/>
  </g>

  <!-- Banner Bottom -->
  <rect x="120" y="335" width="360" height="45" rx="8" fill="#1e1b4b" stroke="#facc15" stroke-width="1.5"/>
  <text x="300" y="356" font-family="'Noto Serif Bengali', serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
    বিদায়ী সংবর্ধনা ও স্মৃতিচারণ • এসএসসি ২০১৪ ব্যাচ
  </text>
  <text x="300" y="371" font-family="'DM Sans', sans-serif" font-size="9.5" font-weight="bold" fill="#fde047" text-anchor="middle" letter-spacing="1">
    SSC 2014 • LIFELONG BOND & GRATITUDE
  </text>
</svg>

