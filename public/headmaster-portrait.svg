<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="300" height="360">
  <defs>
    <linearGradient id="bgHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="skinH" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fae8d7" />
      <stop offset="100%" stop-color="#e2b192" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="360" fill="url(#bgHead)"/>
  <circle cx="150" cy="140" r="110" fill="#047857" opacity="0.3"/>

  <!-- Body / Formal Suit with Tie -->
  <g transform="translate(150, 210)">
    <!-- Suit Shoulders Dark Charcoal -->
    <path d="M -110,150 Q -90,60 0,60 Q 90,60 110,150 Z" fill="#1e293b"/>
    <!-- Suit Lapels -->
    <polygon points="-50,60 -15,120 -40,150" fill="#0f172a"/>
    <polygon points="50,60 15,120 40,150" fill="#0f172a"/>
    <!-- White Shirt -->
    <polygon points="-25,60 25,60 0,115" fill="#f8fafc"/>
    <!-- Maroon Tie with stripes -->
    <polygon points="-8,70 8,70 12,145 0,155 -12,145" fill="#991b1b"/>
    <line x1="-7" y1="88" x2="7" y2="84" stroke="#facc15" stroke-width="2"/>
    <line x1="-9" y1="108" x2="9" y2="104" stroke="#facc15" stroke-width="2"/>
    <line x1="-10" y1="128" x2="10" y2="124" stroke="#facc15" stroke-width="2"/>
  </g>

  <!-- Head & Neck -->
  <g transform="translate(150, 130)">
    <!-- Neck -->
    <rect x="-24" y="60" width="48" height="35" fill="url(#skinH)"/>
    <!-- Head Base -->
    <ellipse cx="0" cy="15" rx="54" ry="64" fill="url(#skinH)"/>
    <!-- Ears -->
    <ellipse cx="-55" cy="18" rx="8" ry="16" fill="url(#skinH)"/>
    <ellipse cx="55" cy="18" rx="8" ry="16" fill="url(#skinH)"/>

    <!-- Hair (Neat side part) -->
    <path d="M -54,0 Q -10,-55 54,0 Q 45,-45 -45,-45 Z" fill="#1e293b"/>
    <path d="M -54,5 Q -56,-25 -15,-45 Q 25,-45 54,-25 Q 56,5 54,15 Q 50,-30 -50,-30 Z" fill="#334155"/>

    <!-- Eyebrows -->
    <path d="M -38,-5 Q -22,-10 -8,-4" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 8,-4 Q 22,-10 38,-5" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Rimless / Thin Frame Glasses -->
    <rect x="-42" y="-3" width="34" height="23" rx="4" fill="none" stroke="#64748b" stroke-width="2"/>
    <rect x="8" y="-3" width="34" height="23" rx="4" fill="none" stroke="#64748b" stroke-width="2"/>
    <line x1="-8" y1="8" x2="8" y2="8" stroke="#64748b" stroke-width="1.8"/>

    <!-- Eyes -->
    <ellipse cx="-25" cy="8" rx="5" ry="4" fill="#0f172a"/>
    <circle cx="-23" cy="7" r="1.5" fill="#ffffff"/>
    <ellipse cx="25" cy="8" rx="5" ry="4" fill="#0f172a"/>
    <circle cx="27" cy="7" r="1.5" fill="#ffffff"/>

    <!-- Nose -->
    <path d="M 0,2 L -2,27 L 4,27" stroke="#c08462" stroke-width="2.2" fill="none" stroke-linecap="round"/>

    <!-- Clean Warm Educator Smile -->
    <path d="M -16,48 Q 0,56 16,48" stroke="#991b1b" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Border & Frame -->
  <rect x="0" y="0" width="300" height="360" fill="none" stroke="#0d5c4a" stroke-width="4"/>
  <rect x="8" y="8" width="284" height="344" fill="none" stroke="#b7d84b" stroke-width="2" opacity="0.6"/>

  <!-- Designation Banner Bottom -->
  <rect x="18" y="305" width="264" height="42" rx="6" fill="#042f24" stroke="#34d399" stroke-width="1.5"/>
  <text x="150" y="323" font-family="'Noto Serif Bengali', serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
    প্রধান শিক্ষক
  </text>
  <text x="150" y="339" font-family="'DM Sans', sans-serif" font-size="10" font-weight="600" fill="#a7f3d0" text-anchor="middle" letter-spacing="1">
    HEADMASTER / PRINCIPAL
  </text>
</svg>

