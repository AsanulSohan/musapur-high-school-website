<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="crestGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="crestGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532D" />
      <stop offset="60%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <linearGradient id="sunGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Ring with Gold Border -->
  <circle cx="120" cy="120" r="114" fill="url(#crestGreen)" stroke="url(#crestGold)" stroke-width="5" filter="url(#shadow)"/>
  <circle cx="120" cy="120" r="105" fill="none" stroke="#FDE68A" stroke-width="1.5" stroke-dasharray="4 2"/>

  <!-- Top Text Path Arc -->
  <path id="textArcTop" d="M 30,120 A 90,90 0 0,1 210,120" fill="none"/>
  <text font-family="'Noto Serif Bengali', 'SolaimanLipi', sans-serif" font-size="13" font-weight="bold" fill="#FEF3C7" letter-spacing="1.5">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      মুছাপুর উচ্চ বিদ্যালয় • নোয়াখালী
    </textPath>
  </text>

  <!-- Bottom Text Path Arc -->
  <path id="textArcBottom" d="M 210,120 A 90,90 0 0,1 30,120" fill="none"/>
  <text font-family="'DM Sans', Arial, sans-serif" font-size="10.5" font-weight="700" fill="#FDE68A" letter-spacing="2">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      MUSAPUR HIGH SCHOOL • ESTD 1972
    </textPath>
  </text>

  <!-- Stars on sides -->
  <polygon points="26,120 28,124 33,124 29,127 31,131 26,128 22,131 24,127 20,124 25,124" fill="#F59E0B"/>
  <polygon points="214,120 216,124 221,124 217,127 219,131 214,128 210,131 212,127 208,124 213,124" fill="#F59E0B"/>

  <!-- Inner Circle Shield -->
  <circle cx="120" cy="120" r="74" fill="#042F24" stroke="url(#crestGold)" stroke-width="3"/>
  <circle cx="120" cy="120" r="69" fill="#0D5C4A"/>

  <!-- Rising Sun Motif -->
  <g transform="translate(120, 114)">
    <circle cx="0" cy="0" r="28" fill="url(#sunGlow)"/>
    <!-- Rays -->
    <line x1="0" y1="-32" x2="0" y2="-44" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="22" y1="-22" x2="31" y2="-31" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-22" y1="-22" x2="-31" y2="-31" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="32" y1="0" x2="44" y2="0" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-32" y1="0" x2="-44" y2="0" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="12" y1="-28" x2="18" y2="-39" stroke="#FDE68A" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="-12" y1="-28" x2="-18" y2="-39" stroke="#FDE68A" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Open Book of Knowledge -->
  <g transform="translate(120, 126)">
    <!-- Book Back shadow -->
    <path d="M 0,6 Q 26,-8 50,0 L 50,28 Q 26,20 0,34 Q -26,20 -50,28 L -50,0 Q -26,-8 0,6 Z" fill="#0B4034"/>
    <!-- Left Page -->
    <path d="M 0,4 Q -25,-9 -47,0 L -47,26 Q -25,18 0,30 Z" fill="#FFFBEB" stroke="#92400E" stroke-width="1"/>
    <!-- Right Page -->
    <path d="M 0,4 Q 25,-9 47,0 L 47,26 Q 25,18 0,30 Z" fill="#FEF3C7" stroke="#92400E" stroke-width="1"/>
    <!-- Center Spine -->
    <line x1="0" y1="4" x2="0" y2="30" stroke="#B45309" stroke-width="2.5"/>
    <!-- Page text lines left -->
    <line x1="-38" y1="6" x2="-10" y2="2" stroke="#0D5C4A" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-38" y1="12" x2="-10" y2="8" stroke="#0D5C4A" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-38" y1="18" x2="-14" y2="14" stroke="#0D5C4A" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Page text lines right -->
    <line x1="10" y1="2" x2="38" y2="6" stroke="#0D5C4A" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="10" y1="8" x2="38" y2="12" stroke="#0D5C4A" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="14" y1="14" x2="38" y2="18" stroke="#0D5C4A" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Torch / Flame of Enlightenment in center above book -->
  <g transform="translate(120, 94)">
    <path d="M 0,-18 Q 8,-7 4,4 Q 0,10 -4,4 Q -8,-7 0,-18 Z" fill="#EF4444"/>
    <path d="M 0,-14 Q 5,-5 2,2 Q 0,6 -2,2 Q -5,-5 0,-14 Z" fill="#FBBF24"/>
    <!-- Torch Handle -->
    <polygon points="-3,5 3,5 2,16 -2,16" fill="url(#crestGold)"/>
    <circle cx="0" cy="5" r="4" fill="#D97706"/>
  </g>

  <!-- Ribbon Banner at Bottom with EIIN -->
  <g transform="translate(120, 168)">
    <path d="M -44,0 L 44,0 L 48,16 L 38,13 L -38,13 L -48,16 Z" fill="#92400E"/>
    <rect x="-38" y="-1" width="76" height="15" rx="3" fill="#F59E0B" stroke="#FEF3C7" stroke-width="1"/>
    <text x="0" y="10" font-family="'DM Sans', sans-serif" font-size="9" font-weight="900" fill="#042F24" text-anchor="middle" letter-spacing="1.2">
      EIIN: 107335
    </text>
  </g>
</svg>

