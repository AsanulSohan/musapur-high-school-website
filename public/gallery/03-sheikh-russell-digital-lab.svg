<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="labBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Lab Interior Background Wall -->
  <rect width="800" height="500" fill="url(#labBg)"/>

  <!-- Lab Floor (Perspective tiles) -->
  <polygon points="0,320 800,320 800,500 0,500" fill="#334155"/>
  <line x1="0" y1="360" x2="800" y2="360" stroke="#475569" stroke-width="2"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#475569" stroke-width="2"/>

  <!-- Sheikh Russell Lab Banner on Top Wall -->
  <g transform="translate(140, 25)">
    <rect x="0" y="0" width="520" height="65" rx="10" fill="#065f46" stroke="#34d399" stroke-width="2"/>
    <text x="260" y="28" font-family="'Noto Serif Bengali', serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
      শেখ রাসেল ডিজিটাল ল্যাব • মুছাপুর উচ্চ বিদ্যালয়
    </text>
    <text x="260" y="50" font-family="'DM Sans', sans-serif" font-size="12" font-weight="600" fill="#a7f3d0" text-anchor="middle" letter-spacing="1">
      SHEIKH RUSSELL DIGITAL COMPUTER LAB · ICT DIVISION
    </text>
  </g>

  <!-- Workstations with Computers (Rows of monitors) -->
  <!-- Back Row Desks -->
  <rect x="60" y="150" width="680" height="15" fill="#64748b"/>
  <!-- Back Row Monitors (6 computers) -->
  <g transform="translate(70, 95)">
    <!-- Monitor 1 -->
    <rect x="10" y="0" width="60" height="42" rx="4" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
    <rect x="14" y="4" width="52" height="34" fill="url(#screenGlow)"/>
    <rect x="35" y="42" width="10" height="13" fill="#64748b"/>
    <!-- Monitor 2 -->
    <rect x="110" y="0" width="60" height="42" rx="4" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
    <rect x="114" y="4" width="52" height="34" fill="url(#screenGlow)"/>
    <rect x="135" y="42" width="10" height="13" fill="#64748b"/>
    <!-- Monitor 3 -->
    <rect x="210" y="0" width="60" height="42" rx="4" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
    <rect x="214" y="4" width="52" height="34" fill="url(#screenGlow)"/>
    <rect x="235" y="42" width="10" height="13" fill="#64748b"/>
    <!-- Monitor 4 -->
    <rect x="310" y="0" width="60" height="42" rx="4" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
    <rect x="314" y="4" width="52" height="34" fill="url(#screenGlow)"/>
    <rect x="335" y="42" width="10" height="13" fill="#64748b"/>
    <!-- Monitor 5 -->
    <rect x="410" y="0" width="60" height="42" rx="4" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
    <rect x="414" y="4" width="52" height="34" fill="url(#screenGlow)"/>
    <rect x="435" y="42" width="10" height="13" fill="#64748b"/>
    <!-- Monitor 6 -->
    <rect x="510" y="0" width="60" height="42" rx="4" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
    <rect x="514" y="4" width="52" height="34" fill="url(#screenGlow)"/>
    <rect x="535" y="42" width="10" height="13" fill="#64748b"/>
  </g>

  <!-- Front Row Big Desks & Large Modern Monitors -->
  <rect x="40" y="270" width="720" height="25" fill="#475569" stroke="#334155" stroke-width="2"/>
  <g transform="translate(60, 180)">
    <!-- Monitor A -->
    <rect x="20" y="0" width="90" height="65" rx="5" fill="#020617" stroke="#38bdf8" stroke-width="3"/>
    <rect x="25" y="5" width="80" height="55" fill="url(#screenGlow)"/>
    <rect x="60" y="65" width="12" height="25" fill="#94a3b8"/>
    <rect x="45" y="85" width="42" height="6" rx="2" fill="#cbd5e1"/>
    <!-- Keyboard -->
    <rect x="30" y="93" width="70" height="14" rx="2" fill="#1e293b" stroke="#64748b" stroke-width="1"/>

    <!-- Monitor B -->
    <rect x="170" y="0" width="90" height="65" rx="5" fill="#020617" stroke="#38bdf8" stroke-width="3"/>
    <rect x="175" y="5" width="80" height="55" fill="url(#screenGlow)"/>
    <rect x="210" y="65" width="12" height="25" fill="#94a3b8"/>
    <rect x="195" y="85" width="42" height="6" rx="2" fill="#cbd5e1"/>
    <!-- Keyboard -->
    <rect x="180" y="93" width="70" height="14" rx="2" fill="#1e293b" stroke="#64748b" stroke-width="1"/>

    <!-- Monitor C -->
    <rect x="320" y="0" width="90" height="65" rx="5" fill="#020617" stroke="#38bdf8" stroke-width="3"/>
    <rect x="325" y="5" width="80" height="55" fill="url(#screenGlow)"/>
    <rect x="360" y="65" width="12" height="25" fill="#94a3b8"/>
    <rect x="345" y="85" width="42" height="6" rx="2" fill="#cbd5e1"/>
    <!-- Keyboard -->
    <rect x="330" y="93" width="70" height="14" rx="2" fill="#1e293b" stroke="#64748b" stroke-width="1"/>

    <!-- Monitor D -->
    <rect x="470" y="0" width="90" height="65" rx="5" fill="#020617" stroke="#38bdf8" stroke-width="3"/>
    <rect x="475" y="5" width="80" height="55" fill="url(#screenGlow)"/>
    <rect x="510" y="65" width="12" height="25" fill="#94a3b8"/>
    <rect x="495" y="85" width="42" height="6" rx="2" fill="#cbd5e1"/>
    <!-- Keyboard -->
    <rect x="480" y="93" width="70" height="14" rx="2" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  </g>

  <!-- Students Studying at Desks (Silhouettes with uniforms) -->
  <g fill="#0284c7" opacity="0.9">
    <!-- Student 1 -->
    <circle cx="125" cy="330" r="22" fill="#f8fafc"/>
    <path d="M 95,390 Q 125,355 155,390 Z" fill="#0d5c4a"/>
    <!-- Student 2 -->
    <circle cx="275" cy="330" r="22" fill="#f8fafc"/>
    <path d="M 245,390 Q 275,355 305,390 Z" fill="#0d5c4a"/>
    <!-- Student 3 -->
    <circle cx="425" cy="330" r="22" fill="#f8fafc"/>
    <path d="M 395,390 Q 425,355 455,390 Z" fill="#0d5c4a"/>
    <!-- Student 4 -->
    <circle cx="575" cy="330" r="22" fill="#f8fafc"/>
    <path d="M 545,390 Q 575,355 605,390 Z" fill="#0d5c4a"/>
  </g>

  <!-- Badge Top Left -->
  <rect x="35" y="35" width="225" height="52" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="50" y="56" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">SMART ICT FACILITY</text>
  <text x="50" y="75" font-family="'Noto Serif Bengali', serif" font-size="13" font-weight="600" fill="#ffffff">ডিজিটাল কম্পিউটার ল্যাব</text>
</svg>

