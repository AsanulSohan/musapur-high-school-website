<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sciBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <linearGradient id="chemicalBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="chemicalAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Lab Background -->
  <rect width="800" height="500" fill="url(#sciBg)"/>

  <!-- Science Lab Banner -->
  <g transform="translate(150, 25)">
    <rect x="0" y="0" width="500" height="60" rx="10" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
    <text x="250" y="27" font-family="'Noto Serif Bengali', serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
      মুছাপুর উচ্চ বিদ্যালয় বিজ্ঞান গবেষণাগার ও বিজ্ঞান মেলা
    </text>
    <text x="250" y="47" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600" fill="#99f6e4" text-anchor="middle" letter-spacing="1">
      ANNUAL SCIENCE FAIR & PRACTICAL LABORATORY
    </text>
  </g>

  <!-- Big Lab Counter Table -->
  <rect x="50" y="260" width="700" height="200" fill="#0f172a" rx="8" stroke="#334155" stroke-width="3"/>
  <rect x="60" y="265" width="680" height="15" fill="#38bdf8"/>

  <!-- Microscope in Center -->
  <g transform="translate(370, 160)">
    <!-- Base -->
    <ellipse cx="30" cy="100" rx="35" ry="10" fill="#64748b"/>
    <rect x="25" y="30" width="10" height="70" fill="#475569"/>
    <!-- Stage -->
    <rect x="10" y="65" width="45" height="6" fill="#1e293b"/>
    <!-- Objective lens turret -->
    <circle cx="30" cy="50" r="12" fill="#94a3b8"/>
    <rect x="26" y="55" width="8" height="15" fill="#e2e8f0"/>
    <!-- Eyepiece tube angled -->
    <rect x="20" y="15" width="10" height="30" fill="#94a3b8" transform="rotate(-20 25 30)"/>
    <ellipse cx="28" cy="12" rx="8" ry="4" fill="#38bdf8"/>
  </g>

  <!-- Erlenmeyer Flask 1 (Cyan liquid with bubbles) -->
  <g transform="translate(180, 180)">
    <polygon points="40,20 55,20 80,85 15,85" fill="none" stroke="#e2e8f0" stroke-width="3"/>
    <polygon points="32,55 63,55 77,83 18,83" fill="url(#chemicalBlue)" opacity="0.85"/>
    <rect x="42" y="10" width="11" height="12" fill="none" stroke="#e2e8f0" stroke-width="2.5"/>
    <!-- Bubbles -->
    <circle cx="45" cy="70" r="3" fill="#ffffff" opacity="0.8"/>
    <circle cx="55" cy="62" r="2.5" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Beaker 2 with Amber chemical -->
  <g transform="translate(270, 195)">
    <rect x="10" y="15" width="45" height="70" rx="4" fill="none" stroke="#e2e8f0" stroke-width="3"/>
    <rect x="13" y="40" width="39" height="42" rx="2" fill="url(#chemicalAmber)" opacity="0.85"/>
    <line x1="12" y1="35" x2="25" y2="35" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="12" y1="50" x2="22" y2="50" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="12" y1="65" x2="25" y2="65" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- Test Tube Rack with Colored Test Tubes -->
  <g transform="translate(480, 205)">
    <!-- Rack frame -->
    <rect x="0" y="40" width="140" height="10" fill="#92400e"/>
    <rect x="0" y="70" width="140" height="12" fill="#92400e"/>
    <rect x="10" y="40" width="8" height="42" fill="#78350f"/>
    <rect x="122" y="40" width="8" height="42" fill="#78350f"/>
    <!-- Test tubes -->
    <!-- Tube 1 -->
    <rect x="25" y="15" width="12" height="60" rx="6" fill="#ec4899" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Tube 2 -->
    <rect x="45" y="15" width="12" height="60" rx="6" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Tube 3 -->
    <rect x="65" y="15" width="12" height="60" rx="6" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Tube 4 -->
    <rect x="85" y="15" width="12" height="60" rx="6" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Tube 5 -->
    <rect x="105" y="15" width="12" height="60" rx="6" fill="#8b5cf6" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- Science Project Poster / Solar System Board -->
  <g transform="translate(630, 130)">
    <rect x="0" y="0" width="110" height="120" rx="4" fill="#0f172a" stroke="#f8fafc" stroke-width="2"/>
    <circle cx="55" cy="55" r="18" fill="#f59e0b"/>
    <circle cx="55" cy="55" r="32" fill="none" stroke="#64748b" stroke-dasharray="2 2"/>
    <circle cx="75" cy="35" r="5" fill="#38bdf8"/>
    <text x="55" y="105" font-family="'DM Sans', sans-serif" font-size="9" font-weight="700" fill="#94a3b8" text-anchor="middle">
      PROJECT EXHIBIT
    </text>
  </g>

  <!-- Badge Top Left -->
  <rect x="35" y="35" width="220" height="52" rx="8" fill="#042f2e" fill-opacity="0.9" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="50" y="56" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#2dd4bf" letter-spacing="1">SCIENCE PRACTICAL</text>
  <text x="50" y="75" font-family="'Noto Serif Bengali', serif" font-size="13" font-weight="600" fill="#ffffff">বিজ্ঞান গবেষণাগার ও মেলা</text>
</svg>

