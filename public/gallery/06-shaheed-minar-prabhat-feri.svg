<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="dawnSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="45%" stop-color="#431407" />
      <stop offset="75%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="redSun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>

  <!-- Early Morning Dawn Sky (Prabhat Feri atmosphere) -->
  <rect width="800" height="500" fill="url(#dawnSky)"/>

  <!-- Shaheed Minar Circular Crimson Sun -->
  <circle cx="400" cy="230" r="115" fill="url(#redSun)"/>

  <!-- Shaheed Minar Monument Architectural Structure -->
  <g transform="translate(400, 230)">
    <!-- Central Tower (Slanted angled canopy column) -->
    <polygon points="-25,90 -20,-70 20,-70 25,90" fill="#f8fafc"/>
    <polygon points="-20,-70 -35,-90 35,-90 20,-70" fill="#e2e8f0"/>
    <polygon points="-35,-90 -10,-120 10,-120 35,-90" fill="#f8fafc"/>

    <!-- Left Flanking Pillar Pair -->
    <polygon points="-80,90 -75,-30 -50,-30 -55,90" fill="#f8fafc"/>
    <polygon points="-75,-30 -85,-45 -40,-45 -50,-30" fill="#e2e8f0"/>

    <polygon points="-135,90 -130,10 -110,10 -115,90" fill="#f8fafc"/>
    <polygon points="-130,10 -138,-3 -102,-3 -110,10" fill="#e2e8f0"/>

    <!-- Right Flanking Pillar Pair -->
    <polygon points="55,90 50,-30 75,-30 80,90" fill="#f8fafc"/>
    <polygon points="50,-30 40,-45 85,-45 75,-30" fill="#e2e8f0"/>

    <polygon points="115,90 110,10 130,10 135,90" fill="#f8fafc"/>
    <polygon points="110,10 102,-3 138,-3 130,10" fill="#e2e8f0"/>

    <!-- Stepped Marble Altar Base -->
    <polygon points="-170,90 170,90 190,110 -190,110" fill="#334155"/>
    <polygon points="-200,110 200,110 220,135 -220,135" fill="#1e293b"/>
    <polygon points="-230,135 230,135 250,165 -250,165" fill="#0f172a"/>
  </g>

  <!-- Floral Wreaths (Shaheed Bedi floral tributes - গাঁদা ও গোলাপের ডালি) -->
  <g transform="translate(400, 375)">
    <circle cx="-120" cy="0" r="28" fill="#f59e0b" stroke="#dc2626" stroke-width="6"/>
    <circle cx="-120" cy="0" r="12" fill="#ef4444"/>

    <circle cx="0" cy="-10" r="38" fill="#e11d48" stroke="#facc15" stroke-width="8"/>
    <circle cx="0" cy="-10" r="18" fill="#ffffff"/>

    <circle cx="120" cy="0" r="28" fill="#f59e0b" stroke="#dc2626" stroke-width="6"/>
    <circle cx="120" cy="0" r="12" fill="#ef4444"/>
  </g>

  <!-- Students in White & Black Clothes Carrying Banner (Prabhat Feri) -->
  <g transform="translate(100, 410)">
    <!-- Banner -->
    <rect x="120" y="0" width="360" height="38" rx="5" fill="#f8fafc" stroke="#000000" stroke-width="2"/>
    <text x="300" y="24" font-family="'Noto Serif Bengali', serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">
      আমার ভাইয়ের রক্তে রাঙানো একুশে ফেব্রুয়ারি • আমি কি ভুলিতে পারি
    </text>
  </g>

  <!-- Badge Top Left -->
  <rect x="35" y="35" width="235" height="52" rx="8" fill="#111827" fill-opacity="0.9" stroke="#ef4444" stroke-width="1.5"/>
  <text x="50" y="56" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#fca5a5" letter-spacing="1">NATIONAL OBSERVANCE</text>
  <text x="50" y="75" font-family="'Noto Serif Bengali', serif" font-size="13" font-weight="600" fill="#ffffff">অমর একুশে ও আন্তর্জাতিক মাতৃভাষা দিবস</text>
</svg>

