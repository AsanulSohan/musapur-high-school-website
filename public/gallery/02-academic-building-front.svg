<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="bldgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>

  <!-- Clear Blue Sky with Clouds -->
  <rect width="800" height="500" fill="url(#skyGrad)"/>
  
  <!-- Fluffy White Clouds -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="150" cy="80" r="35"/>
    <circle cx="190" cy="70" r="45"/>
    <circle cx="230" cy="80" r="35"/>
    <circle cx="560" cy="110" r="30"/>
    <circle cx="600" cy="95" r="42"/>
    <circle cx="640" cy="110" r="32"/>
  </g>

  <!-- Lush Green Lawn Field -->
  <rect y="290" width="800" height="210" fill="url(#grassGrad)"/>

  <!-- Modern Multi-Story Academic Building (3 Stories) -->
  <g transform="translate(100, 110)">
    <!-- Main Facade Wall -->
    <rect x="0" y="30" width="600" height="180" fill="url(#bldgGrad)" stroke="#0d5c4a" stroke-width="4"/>
    <!-- Parapet Header with Green Brand Trim -->
    <rect x="-10" y="10" width="620" height="25" fill="#0d5c4a"/>
    <rect x="-10" y="35" width="620" height="8" fill="#b7d84b"/>

    <!-- School Name on Building Top -->
    <text x="300" y="27" font-family="'Noto Serif Bengali', serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      মুছাপুর উচ্চ বিদ্যালয় • একাডেমিক ভবন
    </text>

    <!-- 3rd Floor Windows (10 windows) -->
    <g fill="#0284c7" stroke="#0d5c4a" stroke-width="2">
      <rect x="30" y="55" width="40" height="32" rx="3"/>
      <rect x="85" y="55" width="40" height="32" rx="3"/>
      <rect x="140" y="55" width="40" height="32" rx="3"/>
      <rect x="195" y="55" width="40" height="32" rx="3"/>
      <!-- Center Portico Balcony -->
      <rect x="255" y="50" width="90" height="42" fill="#0f766e" rx="4"/>
      <rect x="365" y="55" width="40" height="32" rx="3"/>
      <rect x="420" y="55" width="40" height="32" rx="3"/>
      <rect x="475" y="55" width="40" height="32" rx="3"/>
      <rect x="530" y="55" width="40" height="32" rx="3"/>
    </g>

    <!-- 2nd Floor Windows -->
    <g fill="#0284c7" stroke="#0d5c4a" stroke-width="2">
      <rect x="30" y="105" width="40" height="32" rx="3"/>
      <rect x="85" y="105" width="40" height="32" rx="3"/>
      <rect x="140" y="105" width="40" height="32" rx="3"/>
      <rect x="195" y="105" width="40" height="32" rx="3"/>
      <!-- Center Portico Balcony Floor 2 -->
      <rect x="255" y="100" width="90" height="42" fill="#0f766e" rx="4"/>
      <rect x="365" y="105" width="40" height="32" rx="3"/>
      <rect x="420" y="105" width="40" height="32" rx="3"/>
      <rect x="475" y="105" width="40" height="32" rx="3"/>
      <rect x="530" y="105" width="40" height="32" rx="3"/>
    </g>

    <!-- Ground Floor Corridor & Entrance -->
    <rect x="20" y="150" width="560" height="60" fill="#e2e8f0"/>
    <!-- Pillars -->
    <rect x="25" y="150" width="14" height="60" fill="#0d5c4a"/>
    <rect x="85" y="150" width="14" height="60" fill="#0d5c4a"/>
    <rect x="145" y="150" width="14" height="60" fill="#0d5c4a"/>
    <rect x="205" y="150" width="14" height="60" fill="#0d5c4a"/>
    <!-- Grand Entrance Center with Arch -->
    <rect x="255" y="150" width="90" height="60" fill="#042f24"/>
    <path d="M 265,150 Q 300,120 335,150 Z" fill="#0d5c4a"/>
    <rect x="380" y="150" width="14" height="60" fill="#0d5c4a"/>
    <rect x="440" y="150" width="14" height="60" fill="#0d5c4a"/>
    <rect x="500" y="150" width="14" height="60" fill="#0d5c4a"/>
    <rect x="560" y="150" width="14" height="60" fill="#0d5c4a"/>
    <!-- Plinth Base -->
    <rect x="-15" y="210" width="630" height="15" fill="#475569"/>
  </g>

  <!-- Trees along Campus Border -->
  <g fill="#166534">
    <ellipse cx="60" cy="270" rx="45" ry="70"/>
    <ellipse cx="740" cy="270" rx="45" ry="70"/>
  </g>

  <!-- Bangladesh National Flag on Tall Mast -->
  <line x1="400" y1="20" x2="400" y2="300" stroke="#f8fafc" stroke-width="4"/>
  <rect x="402" y="22" width="60" height="36" fill="#006a4e"/>
  <circle cx="428" cy="40" r="13" fill="#f42a41"/>

  <!-- Badge Top Left -->
  <rect x="35" y="35" width="230" height="54" rx="8" fill="#064e3b" fill-opacity="0.9" stroke="#b7d84b" stroke-width="1.5"/>
  <text x="50" y="56" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#b7d84b" letter-spacing="1">MAIN CAMPUS VIEW</text>
  <text x="50" y="76" font-family="'Noto Serif Bengali', serif" font-size="14" font-weight="600" fill="#ffffff">প্রধান একাডেমিক ভবন ও প্রাঙ্গণ</text>

  <!-- Bottom Details Bar -->
  <rect x="35" y="435" width="730" height="38" rx="6" fill="#064e3b" fill-opacity="0.9" stroke="#ffffff" stroke-width="1"/>
  <text x="55" y="458" font-family="'Noto Serif Bengali', serif" font-size="12" font-weight="500" fill="#ffffff">
    মুছাপুর, কোম্পানীগঞ্জ, নোয়াখালী • কুমিল্লা শিক্ষা বোর্ড অনুমোদিত • EIIN: ১০৭৩৩৫
  </text>
  <text x="745" y="458" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#b7d84b" text-anchor="end">
    ESTABLISHED 1972
  </text>
</svg>

