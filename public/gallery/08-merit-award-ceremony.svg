<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="stageBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldMedal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <!-- Auditorium / Stage Background -->
  <rect width="800" height="500" fill="url(#stageBg)"/>

  <!-- Stage Curtains Left & Right -->
  <path d="M 0,0 L 100,0 Q 80,250 140,500 L 0,500 Z" fill="#991b1b"/>
  <path d="M 800,0 L 700,0 Q 720,250 660,500 L 800,500 Z" fill="#991b1b"/>

  <!-- Stage Plinth -->
  <rect y="360" width="800" height="140" fill="#042f24" stroke="#d97706" stroke-width="4"/>
  <rect y="365" width="800" height="15" fill="#d97706"/>

  <!-- Grand Backdrop Banner on Stage -->
  <g transform="translate(130, 40)">
    <rect x="0" y="0" width="540" height="160" rx="12" fill="#064e3b" stroke="#facc15" stroke-width="3"/>
    <text x="270" y="45" font-family="'Noto Serif Bengali', serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">
      মুছাপুর উচ্চ বিদ্যালয় • কৃতি শিক্ষার্থী সংবর্ধনা
    </text>
    <text x="270" y="75" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700" fill="#facc15" text-anchor="middle" letter-spacing="1">
      ANNUAL SSC MERIT AWARD & PRIZE GIVING CEREMONY
    </text>
    <line x1="80" y1="92" x2="460" y2="92" stroke="#facc15" stroke-width="1.5"/>
    <text x="270" y="118" font-family="'Noto Serif Bengali', serif" font-size="14" font-weight="600" fill="#a7f3d0" text-anchor="middle">
      "মেধার বিকাশ, নৈতিকতার দীক্ষা ও আলোকিত সমাজ বিনির্মাণ"
    </text>
    <text x="270" y="142" font-family="'DM Sans', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">
      ESTD 1972 · EIIN: 107335 · COMILLA EDUCATION BOARD
    </text>
  </g>

  <!-- Big Gold Medals & Crests on Stage Podium -->
  <g transform="translate(400, 260)">
    <!-- Podium -->
    <rect x="-80" y="10" width="160" height="90" fill="#1e293b" rx="4" stroke="#64748b" stroke-width="2"/>
    <rect x="-70" y="15" width="140" height="15" fill="#facc15"/>
    <text x="0" y="27" font-family="'DM Sans', sans-serif" font-size="11" font-weight="900" fill="#1e293b" text-anchor="middle">
      GPA 5.00 ACHIEVERS
    </text>
    <!-- Big Trophy -->
    <path d="M -25,-40 L 25,-40 L 18,10 Q 0,25 -18,10 Z" fill="url(#goldMedal)" stroke="#a16207" stroke-width="2"/>
    <path d="M -25,-32 Q -40,-20 -20,-5" fill="none" stroke="#a16207" stroke-width="3"/>
    <path d="M 25,-32 Q 40,-20 20,-5" fill="none" stroke="#a16207" stroke-width="3"/>
    <circle cx="0" cy="-18" r="8" fill="#ffffff"/>
  </g>

  <!-- Top Achievers & Teachers Receiving Awards (Silhouettes) -->
  <g transform="translate(180, 270)">
    <!-- Student with Graduation Cap -->
    <circle cx="20" cy="15" r="14" fill="#fbcfe8"/>
    <!-- Mortarboard Cap -->
    <polygon points="5,7 20,2 35,7 20,12" fill="#0f172a"/>
    <line x1="20" y1="7" x2="33" y2="15" stroke="#facc15" stroke-width="2"/>
    <rect x="8" y="30" width="24" height="60" fill="#0d5c4a" rx="4"/>
    <!-- Certificate in hand -->
    <rect x="25" y="45" width="22" height="15" fill="#ffffff" stroke="#eab308" stroke-width="1.5" transform="rotate(-15 25 45)"/>
  </g>

  <g transform="translate(560, 270)">
    <!-- Another Topper Student with Crest -->
    <circle cx="20" cy="15" r="14" fill="#fbcfe8"/>
    <polygon points="5,7 20,2 35,7 20,12" fill="#0f172a"/>
    <line x1="20" y1="7" x2="33" y2="15" stroke="#facc15" stroke-width="2"/>
    <rect x="8" y="30" width="24" height="60" fill="#0d5c4a" rx="4"/>
    <rect x="-8" y="45" width="22" height="15" fill="#ffffff" stroke="#eab308" stroke-width="1.5" transform="rotate(15 -8 45)"/>
  </g>

  <!-- Confetti and Sparkles -->
  <g fill="#facc15">
    <circle cx="160" cy="150" r="3"/>
    <circle cx="220" cy="90" r="4"/>
    <circle cx="340" cy="220" r="3"/>
    <circle cx="480" cy="210" r="4"/>
    <circle cx="600" cy="120" r="3"/>
    <circle cx="650" cy="180" r="3"/>
  </g>
  <g fill="#38bdf8">
    <circle cx="200" cy="120" r="3"/>
    <circle cx="280" cy="230" r="3"/>
    <circle cx="530" cy="190" r="4"/>
    <circle cx="630" cy="90" r="3"/>
  </g>

  <!-- Badge Top Left -->
  <rect x="35" y="35" width="235" height="52" rx="8" fill="#1e1b4b" fill-opacity="0.9" stroke="#facc15" stroke-width="1.5"/>
  <text x="50" y="56" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#fde047" letter-spacing="1">ACADEMIC HONORS</text>
  <text x="50" y="75" font-family="'Noto Serif Bengali', serif" font-size="13" font-weight="600" fill="#ffffff">কৃতি শিক্ষার্থী সংবর্ধনা ও মেধা পুরস্কার</text>
</svg>

