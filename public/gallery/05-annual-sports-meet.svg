<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sportsSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="trackGround" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#sportsSky)"/>

  <!-- School Sports Ground Field -->
  <rect y="240" width="800" height="260" fill="url(#trackGround)"/>

  <!-- Running Track Curved White Lines -->
  <g fill="none" stroke="#f8fafc" stroke-width="3">
    <ellipse cx="400" cy="460" rx="420" ry="180"/>
    <ellipse cx="400" cy="460" rx="360" ry="155"/>
    <ellipse cx="400" cy="460" rx="300" ry="130"/>
    <ellipse cx="400" cy="460" rx="240" ry="105"/>
  </g>

  <!-- Colorful Shamiyana / VIP Pavilion Tent in Background -->
  <g transform="translate(180, 100)">
    <!-- Stripes Canopy Roof (Red and White Shamiyana) -->
    <polygon points="0,70 220,15 440,70 420,85 220,35 20,85" fill="#dc2626"/>
    <polygon points="40,81 220,31 400,81 380,95 220,45 60,95" fill="#ffffff"/>
    <polygon points="80,91 220,41 360,91 340,105 220,55 100,105" fill="#16a34a"/>
    <!-- Tent Poles -->
    <line x1="20" y1="85" x2="20" y2="180" stroke="#475569" stroke-width="4"/>
    <line x1="220" y1="35" x2="220" y2="180" stroke="#475569" stroke-width="5"/>
    <line x1="420" y1="85" x2="420" y2="180" stroke="#475569" stroke-width="4"/>
    <!-- Banner on Tent -->
    <rect x="70" y="90" width="300" height="40" rx="6" fill="#065f46" stroke="#facc15" stroke-width="2"/>
    <text x="220" y="115" font-family="'Noto Serif Bengali', serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      মুছাপুর উচ্চ বিদ্যালয় বার্ষিক ক্রীড়া প্রতিযোগিতা
    </text>
  </g>

  <!-- Athletes / Runners in Action (Stylized) -->
  <!-- Runner 1 (Leading in Blue) -->
  <g transform="translate(480, 260)">
    <circle cx="20" cy="0" r="14" fill="#fbcfe8"/>
    <line x1="20" y1="14" x2="15" y2="55" stroke="#1d4ed8" stroke-width="9" stroke-linecap="round"/>
    <!-- Limbs -->
    <line x1="18" y1="24" x2="-6" y2="40" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round"/>
    <line x1="18" y1="24" x2="42" y2="15" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round"/>
    <line x1="15" y1="55" x2="-10" y2="90" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
    <line x1="15" y1="55" x2="45" y2="75" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
    <line x1="45" y1="75" x2="52" y2="110" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Runner 2 (Green Jersey) -->
  <g transform="translate(350, 280)">
    <circle cx="20" cy="0" r="14" fill="#fbcfe8"/>
    <line x1="20" y1="14" x2="16" y2="55" stroke="#15803d" stroke-width="9" stroke-linecap="round"/>
    <line x1="18" y1="24" x2="-2" y2="35" stroke="#15803d" stroke-width="5" stroke-linecap="round"/>
    <line x1="18" y1="24" x2="38" y2="18" stroke="#15803d" stroke-width="5" stroke-linecap="round"/>
    <line x1="16" y1="55" x2="-5" y2="90" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
    <line x1="16" y1="55" x2="40" y2="80" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Runner 3 (Red Jersey) -->
  <g transform="translate(220, 300)">
    <circle cx="20" cy="0" r="14" fill="#fbcfe8"/>
    <line x1="20" y1="14" x2="18" y2="55" stroke="#dc2626" stroke-width="9" stroke-linecap="round"/>
    <line x1="18" y1="24" x2="0" y2="35" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
    <line x1="18" y1="24" x2="36" y2="20" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
    <line x1="18" y1="55" x2="0" y2="85" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
    <line x1="18" y1="55" x2="38" y2="85" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Red Finish Ribbon Across Track -->
  <line x1="580" y1="280" x2="720" y2="380" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>

  <!-- Trophy Podium in Corner -->
  <g transform="translate(670, 140)">
    <!-- Gold Trophy -->
    <path d="M 25,10 L 55,10 L 50,45 Q 40,60 25,45 Z" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>
    <path d="M 25,15 Q 12,25 24,35" fill="none" stroke="#ca8a04" stroke-width="3"/>
    <path d="M 55,15 Q 68,25 56,35" fill="none" stroke="#ca8a04" stroke-width="3"/>
    <rect x="36" y="52" width="8" height="15" fill="#ca8a04"/>
    <rect x="28" y="67" width="24" height="10" fill="#78350f" rx="2"/>
  </g>

  <!-- Badge Top Left -->
  <rect x="35" y="35" width="225" height="52" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="50" y="56" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#f59e0b" letter-spacing="1">ANNUAL ATHLETICS</text>
  <text x="50" y="75" font-family="'Noto Serif Bengali', serif" font-size="13" font-weight="600" fill="#ffffff">বার্ষিক ক্রীড়া ও অ্যাথলেটিকস</text>
</svg>

