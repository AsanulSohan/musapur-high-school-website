<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#042f24" />
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae8d7" />
      <stop offset="100%" stop-color="#dfa886" />
    </linearGradient>
  </defs>

  <rect width="240" height="240" fill="url(#avatarBg)"/>
  <circle cx="120" cy="120" r="105" fill="#0d5c4a" opacity="0.3"/>

  <!-- Shoulders / Coat -->
  <path d="M 40,240 Q 60,160 120,160 Q 180,160 200,240 Z" fill="#1e293b"/>
  <polygon points="100,160 140,160 120,205" fill="#f8fafc"/>
  <polygon points="113,168 127,168 125,230 115,230" fill="#991b1b"/>

  <!-- Neck -->
  <rect x="102" y="130" width="36" height="35" fill="url(#skin)"/>

  <!-- Head -->
  <ellipse cx="120" cy="95" rx="46" ry="54" fill="url(#skin)"/>

  <!-- Hair -->
  <path d="M 74,80 Q 120,40 166,80 Q 160,45 80,45 Z" fill="#1e293b"/>

  <!-- Glasses -->
  <rect x="85" y="82" width="28" height="18" rx="4" fill="none" stroke="#64748b" stroke-width="2"/>
  <rect x="127" y="82" width="28" height="18" rx="4" fill="none" stroke="#64748b" stroke-width="2"/>
  <line x1="113" y1="91" x2="127" y2="91" stroke="#64748b" stroke-width="2"/>

  <!-- Warm Smile -->
  <path d="M 108,124 Q 120,132 132,124" stroke="#991b1b" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Border -->
  <rect x="0" y="0" width="240" height="240" fill="none" stroke="#b7d84b" stroke-width="3" opacity="0.5"/>
</svg>

